services:
  - type: web
    name: pos-system-api
    runtime: node
    buildCommand: npm install && npm run build
    # This project syncs schema with `db push` — the migrations folder is stale.
    # Running migrate:deploy here left the production DB missing new columns,
    # which broke every query (including login) after deploys.
    # --accept-data-loss: answers the non-interactive confirmation when Prisma
    # drops legacy structures left over from the old migration-built schema
    # (current tables/data are untouched — the schema changes are additive).
    # --skip-generate: the client was already generated during the build.
    startCommand: npx prisma db push --accept-data-loss --skip-generate && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # Required for "forgot password" emails to link to your real site
      # instead of localhost. Falls back to FRONTEND_URL if left unset, but
      # set it explicitly if FRONTEND_URL ever lists more than one origin.
      - key: APP_URL
        sync: false
      # Required for "forgot password" / receipt emails to actually send.
      # Leave these unset and every send attempt fails loudly in production
      # (a real SMTP account is required — e.g. a Gmail address with an App
      # Password, or any transactional email provider's SMTP credentials).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
