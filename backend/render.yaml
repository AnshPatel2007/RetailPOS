services:
  - type: web
    name: pos-system-api
    runtime: node
    buildCommand: npm install && npm run build
    # This project syncs schema with `db push` — the migrations folder is stale.
    # Running migrate:deploy here left the production DB missing new columns,
    # which broke every query (including login) after deploys.
    startCommand: npx prisma db push && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
