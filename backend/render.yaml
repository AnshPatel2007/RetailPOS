services:
  - type: web
    name: pos-system-api
    runtime: node
    buildCommand: npm install && npm run build
    # Existing databases require the one-time, drift-checked baseline procedure
    # in DATABASE_MIGRATIONS.md. Startup fails safely if it has not been completed.
    startCommand: npm run db:migrate:deploy && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      # Required for "forgot password" emails to link to your real site
      # instead of localhost. Falls back to FRONTEND_URL if left unset, but
      # set it explicitly if FRONTEND_URL ever lists more than one origin.
      - key: APP_URL
        sync: false
      # Required for "forgot password" / receipt emails to actually send.
      # Render blocks outbound SMTP entirely (confirmed: both 587 and 465
      # time out at the TCP connect stage, regardless of credentials), so
      # raw SMTP_* vars alone will NOT work here — set SENDGRID_API_KEY
      # below, which sends over HTTPS instead. SMTP_* is still read as a
      # fallback for local dev, where SMTP isn't blocked.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Sends email via SendGrid's HTTPS API instead of SMTP — required on
      # Render since SMTP ports are blocked outbound. Get a free API key at
      # sendgrid.com after verifying a "Single Sender" (no domain needed).
      - key: SENDGRID_API_KEY
        sync: false
